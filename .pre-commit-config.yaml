minimum_pre_commit_version: "4.6.0"
fail_fast: false

default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: python -m ruff check .
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: ruff-format
        name: Ruff format check
        entry: python -m ruff format --check .
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: mypy
        name: mypy strict package check
        entry: python -m mypy local_home_devices_mcp
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: bandit
        name: Bandit security check
        entry: python -m bandit -r local_home_devices_mcp tools -ll
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: focused-tests
        name: Focused zero-I/O tests
        entry: python -m pytest tests/unit tests/integration/test_mock_runtime.py -q
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: full-tests
        name: Full non-real-system gate
        entry: python -m pytest -m not\ real_system
        language: system
        pass_filenames: false
        stages: [pre-push]
