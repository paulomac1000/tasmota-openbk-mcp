name: CI

on:
  push:
    branches: [main, agent/ai-skills-compliance-refactor]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  AI_SKILLS_REVISION: 690a1dd939f8430af71b83a7ae01b35a694b4bc3

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Check out standards
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: paulomac1000/ai-skills
          ref: ${{ env.AI_SKILLS_REVISION }}
          path: .standards
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check --diff .
      - name: Type check application kernel
        run: mypy local_home_devices_mcp
      - name: Compile all Python sources
        run: python -m compileall -q local_home_devices_mcp tools server.py scripts tests
      - name: Security scan
        run: bandit -r local_home_devices_mcp tools -ll
      - name: Validate canonical capability manifests
        run: |
          rm -rf /tmp/capability-manifests
          python scripts/export_capability_manifests.py --output /tmp/capability-manifests/default
          python scripts/export_capability_manifests.py --mock --output /tmp/capability-manifests/mock
          python .standards/contracts/validate_capability_manifest.py \
            --schema .standards/contracts/capability-manifest.schema.json \
            /tmp/capability-manifests/default/*.json \
            /tmp/capability-manifests/mock/*.json
      - name: Validate AFDS documentation
        run: python .standards/skills/afds-doc-writer/validate.py README.md docs
      - name: Audit and validate AGENTS instructions
        run: |
          rm -rf /tmp/agents-audit && mkdir -p /tmp/agents-audit
          tar --exclude='./.standards' --exclude='./.git' --exclude='./.venv' \
            -cf - . | tar -xf - -C /tmp/agents-audit
          python .standards/skills/agents-md-architect/tools/audit_agents_md.py \
            --strict --layout single --profile mcp-server --language en /tmp/agents-audit
          python .standards/skills/agents-md-architect/tools/validate_agents_md.py \
            --strict --repository-root /tmp/agents-audit --layout single --profile mcp-server \
            --language en /tmp/agents-audit/AGENTS.md
      - name: Validate GitHub Actions policy
        run: python .standards/skills/ci-cd-architect/tools/check_github_actions_policy.py .

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: quality
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Run zero-I/O application smoke
        run: MCP_MOCK_MODE=1 ENABLE_WRITE_OPERATIONS=1 python server.py --mock-self-test
      - name: Run complete non-real-system suite including real transports
        run: |
          python -m pytest -m 'not real_system' \
            --cov=local_home_devices_mcp --cov=tools \
            --cov-report=term-missing --cov-report=xml

  exact-wheel:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: test
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.13"
      - name: Build exact wheel and dependency lock candidates
        run: |
          python -m pip install --upgrade pip
          python -m pip install build==1.3.0
          python -m build --wheel
          sha256sum dist/*.whl | tee dist/SHA256SUMS
          mkdir -p locks wheelhouse
          python -m pip install --dry-run --ignore-installed \
            --report /tmp/runtime-dependencies.json dist/*.whl
          python scripts/lock_wheelhouse.py \
            /tmp/runtime-dependencies.json locks/linux-x86_64-py313-runtime.lock
          python -m pip install --dry-run --ignore-installed \
            --report /tmp/dev-dependencies.json '.[dev]'
          python scripts/lock_wheelhouse.py \
            /tmp/dev-dependencies.json locks/linux-x86_64-py313-dev.lock
          cp locks/linux-x86_64-py313-runtime.lock requirements.lock
          python -m pip download --require-hashes \
            --requirement requirements.lock --dest wheelhouse
      - name: Install and probe exact wheel over real stdio
        run: |
          python -m venv /tmp/exact-wheel
          /tmp/exact-wheel/bin/python -m pip install \
            --no-index --find-links=wheelhouse --require-hashes -r requirements.lock
          /tmp/exact-wheel/bin/python -m pip install --no-index --no-deps dist/*.whl
          MCP_MOCK_MODE=1 ENABLE_WRITE_OPERATIONS=1 \
          MCP_ARTIFACT_ROOT=/tmp/exact-wheel-artifacts \
            /tmp/exact-wheel/bin/python scripts/mcp_transport_probe.py \
              stdio /tmp/exact-wheel/bin/local-home-devices-mcp
      - name: Upload exact wheel and lock candidates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ github.sha }}
          path: |
            dist/
            locks/
            requirements.lock
            wheelhouse/
          if-no-files-found: error
          retention-days: 14

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [test, exact-wheel]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.13"
      - name: Download exact tested wheel and locked dependencies
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel-${{ github.sha }}
          path: .
      - name: Verify exact wheel identity and install probe dependencies offline
        run: |
          sha256sum --check dist/SHA256SUMS
          python -m pip install --no-index --find-links=wheelhouse \
            --require-hashes -r requirements.lock
      - name: Build image once from exact wheel
        run: docker build --tag local-home-devices-mcp:${{ github.sha }} .
      - name: Probe exact image over real stdio
        run: |
          MCP_MOCK_MODE=1 ENABLE_WRITE_OPERATIONS=1 \
            python scripts/mcp_transport_probe.py stdio docker run --rm -i \
              -e MCP_MOCK_MODE=1 -e MCP_TRANSPORT=stdio \
              -e ENABLE_WRITE_OPERATIONS=1 \
              local-home-devices-mcp:${GITHUB_SHA}
      - name: Probe exact image over real Streamable HTTP
        env:
          READ_TOKEN: 0123456789abcdef0123456789abcdef
        run: |
          docker run -d --name local-home-devices-mcp-test \
            --network host \
            -e MCP_MOCK_MODE=1 -e MCP_TRANSPORT=http \
            -e BIND_HOST=127.0.0.1 \
            -e MCP_AUTH_READ_TOKEN=${READ_TOKEN} \
            -e MCP_HTTP_DEVELOPMENT_MODE=1 \
            local-home-devices-mcp:${GITHUB_SHA}
          trap 'docker logs local-home-devices-mcp-test; docker rm -f local-home-devices-mcp-test' EXIT
          for attempt in $(seq 1 50); do
            curl --fail --silent http://127.0.0.1:9102/health && break
            sleep 0.2
          done
          python scripts/mcp_transport_probe.py http http://127.0.0.1:9102/mcp --token "${READ_TOKEN}"
      - name: Export already tested image
        run: |
          docker save local-home-devices-mcp:${GITHUB_SHA} | gzip -n > image.tar.gz
          sha256sum image.tar.gz > image.tar.gz.sha256
          printf 'revision=%s\n' "${GITHUB_SHA}" > image-metadata.txt
          sed 's/^/wheel=/' dist/SHA256SUMS >> image-metadata.txt
      - name: Upload exact image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ github.sha }}
          path: |
            image.tar.gz
            image.tar.gz.sha256
            image-metadata.txt
          if-no-files-found: error
          retention-days: 30
