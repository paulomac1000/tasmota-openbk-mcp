# ai-skills-policy-profile: trusted-ci
name: Temporary exact source export

on:
  push:
    branches: [agent/ai-skills-compliance-refactor]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-source-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Archive exact source
        run: |
          set -euo pipefail
          git archive --format=zip --output=source.zip HEAD
          sha256sum source.zip > source.zip.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-${{ github.sha }}
          path: |
            source.zip
            source.zip.sha256
          if-no-files-found: error
          retention-days: 1
