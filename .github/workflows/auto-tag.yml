name: Validate release request

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer version without leading v
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate version only
        env:
          VERSION: ${{ inputs.version }}
        run: '[[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]'
      - name: Explain protected release flow
        run: |
          echo "This workflow does not create tags or publish packages."
          echo "Use the protected release workflow only after trusted CI succeeds."
