name: Validate release request

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer version without leading v
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate version only
        env:
          VERSION: ${{ inputs.version }}
        run: '[[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]'

      - name: Explain protected release flow
        run: |
          echo "Tags are not created automatically before CI."
          echo "Create an annotated tag only after the main-branch sha image exists."
          echo "The promotion workflow reuses that exact registry digest."
