name: Promote tested image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: SemVer tag without leading v
        required: true
        type: string
      revision:
        description: Full tested commit SHA on main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: promote-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      packages: write
    steps:
      - name: Resolve and validate release identity
        id: identity
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_REVISION: ${{ inputs.revision }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            REVISION="${GITHUB_SHA}"
          else
            VERSION="${INPUT_VERSION}"
            REVISION="${INPUT_REVISION}"
          fi
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]
          [[ "${REVISION}" =~ ^[0-9a-f]{40}$ ]]
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "revision=${REVISION}" >> "${GITHUB_OUTPUT}"

      - name: Check out the exact release revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ steps.identity.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify revision and package version
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          REVISION: ${{ steps.identity.outputs.revision }}
        run: |
          test "$(git rev-parse HEAD)" = "${REVISION}"
          git merge-base --is-ancestor "${REVISION}" origin/main
          PACKAGE_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "${PACKAGE_VERSION}" = "${VERSION}"

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote the tested manifest without rebuilding
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          REVISION: ${{ steps.identity.outputs.revision }}
        run: |
          SOURCE="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${REVISION}"
          docker buildx imagetools inspect "${SOURCE}"
          docker buildx imagetools create \
            --tag "ghcr.io/${GITHUB_REPOSITORY,,}:${VERSION}" \
            --tag "ghcr.io/${GITHUB_REPOSITORY,,}:latest" \
            "${SOURCE}"

      - name: Create release for a version tag
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          generate_release_notes: true
          make_latest: true
