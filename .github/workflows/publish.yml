name: Promote exact release image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to promote, without v prefix
        required: true
        type: string
      revision:
        description: Exact tested main commit SHA
        required: true
        type: string

permissions:
  contents: read
  packages: write
  actions: read
  attestations: read
  id-token: write

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve version and immutable revision
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_REVISION: ${{ inputs.revision }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            REVISION="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
          else
            VERSION="${INPUT_VERSION}"
            REVISION="${INPUT_REVISION}"
          fi
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "${REVISION}" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "${REVISION}" origin/main
          git checkout --detach "${REVISION}"
          PACKAGE_VERSION="$(
            python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])'
          )"
          test "${PACKAGE_VERSION}" = "${VERSION}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "revision=${REVISION}" >> "${GITHUB_OUTPUT}"
      - name: Download identity emitted by successful CI for the exact revision
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ steps.release.outputs.revision }}
        run: |
          RUN_ID="$(gh run list --workflow CI --commit "${REVISION}" --status success \
            --json databaseId,headSha \
            --jq ".[] | select(.headSha == \"${REVISION}\") | .databaseId" | head -n 1)"
          test -n "${RUN_ID}" && test "${RUN_ID}" != "null"
          gh run download "${RUN_ID}" --name "image-identity-${REVISION}" --dir release-identity
      - name: Verify exact digest and provenance
        id: identity
        env:
          REVISION: ${{ steps.release.outputs.revision }}
          GH_TOKEN: ${{ github.token }}
        run: |
          IDENTITY="$(sed -n '1p' release-identity/image-identity.txt)"
          RECORDED_REVISION="$(sed -n 's/^revision=//p' release-identity/image-identity.txt)"
          [[ "${IDENTITY}" =~ ^ghcr\.io/[a-z0-9_.-]+/[a-z0-9_.-]+@sha256:[0-9a-f]{64}$ ]]
          test "${RECORDED_REVISION}" = "${REVISION}"
          gh attestation verify "${IDENTITY}" --repo "${GITHUB_REPOSITORY}"
          echo "identity=${IDENTITY}" >> "${GITHUB_OUTPUT}"
      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote exact digest without rebuilding or tag resolution
        env:
          VERSION: ${{ steps.release.outputs.version }}
          IDENTITY: ${{ steps.identity.outputs.identity }}
        run: |
          REPOSITORY="${IDENTITY%@*}"
          docker buildx imagetools create \
            --tag "${REPOSITORY}:${VERSION}" \
            --tag "${REPOSITORY}:latest" \
            "${IDENTITY}"
