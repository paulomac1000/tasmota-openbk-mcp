name: Publish exact release image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, without v prefix
        required: true
        type: string
      revision:
        description: Exact tested main commit SHA
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.revision || github.sha }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.release.outputs.version }}
      revision: ${{ steps.release.outputs.revision }}
    steps:
      - name: Check out source only in read-only validation job
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve version and immutable revision
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_REVISION: ${{ inputs.revision }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            REVISION="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
          else
            VERSION="${INPUT_VERSION}"
            REVISION="${INPUT_REVISION}"
          fi
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "${REVISION}" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "${REVISION}" origin/main
          git checkout --detach "${REVISION}"
          PACKAGE_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "${PACKAGE_VERSION}" = "${VERSION}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "revision=${REVISION}" >> "${GITHUB_OUTPUT}"
      - name: Locate successful CI for exact revision
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ steps.release.outputs.revision }}
        run: |
          RUN_ID="$(gh run list --workflow CI --commit "${REVISION}" --status success \
            --json databaseId,headSha --jq ".[] | select(.headSha == \"${REVISION}\") | .databaseId" | head -n 1)"
          test -n "${RUN_ID}" && test "${RUN_ID}" != "null"
          echo "run_id=${RUN_ID}" >> "${GITHUB_OUTPUT}"
      - name: Download exact image from successful CI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-${{ steps.release.outputs.revision }}
          run-id: ${{ steps.ci.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Verify closed image and exact revision metadata
        env:
          REVISION: ${{ steps.release.outputs.revision }}
        run: |
          sha256sum --check image.tar.gz.sha256
          test "$(sed -n 's/^revision=//p' image-metadata.txt)" = "${REVISION}"
          gzip -dc image.tar.gz | docker load
          docker image inspect "local-home-devices-mcp:${REVISION}" >/dev/null
          docker run --rm \
            -e MCP_MOCK_MODE=1 -e MCP_TRANSPORT=stdio \
            -e ENABLE_WRITE_OPERATIONS=1 \
            "local-home-devices-mcp:${REVISION}" --mock-self-test
      - name: Record validated release metadata
        env:
          VERSION: ${{ steps.release.outputs.version }}
          REVISION: ${{ steps.release.outputs.revision }}
          CI_RUN_ID: ${{ steps.ci.outputs.run_id }}
        run: |
          printf 'version=%s\nrevision=%s\nci_run_id=%s\n' \
            "${VERSION}" "${REVISION}" "${CI_RUN_ID}" > release-metadata.txt
          cat image.tar.gz.sha256 >> release-metadata.txt
      - name: Seal validated release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle-${{ steps.release.outputs.revision }}
          path: |
            image.tar.gz
            image.tar.gz.sha256
            image-metadata.txt
            release-metadata.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Download only the closed validated release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle-${{ needs.validate.outputs.revision }}
      - name: Verify sealed bundle without executing candidate source
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          REVISION: ${{ needs.validate.outputs.revision }}
        run: |
          sha256sum --check image.tar.gz.sha256
          test "$(sed -n 's/^version=//p' release-metadata.txt)" = "${VERSION}"
          test "$(sed -n 's/^revision=//p' release-metadata.txt)" = "${REVISION}"
          gzip -dc image.tar.gz | docker load
          docker image inspect "local-home-devices-mcp:${REVISION}" >/dev/null
      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested bytes and immutable digest
        id: push
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          REVISION: ${{ needs.validate.outputs.revision }}
        run: |
          REPOSITORY="ghcr.io/${GITHUB_REPOSITORY,,}"
          SHA_TAG="${REPOSITORY}:sha-${REVISION}"
          docker tag "local-home-devices-mcp:${REVISION}" "${SHA_TAG}"
          docker push "${SHA_TAG}"
          IDENTITY="$(docker inspect --format='{{index .RepoDigests 0}}' "${SHA_TAG}")"
          [[ "${IDENTITY}" =~ @sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools create --tag "${REPOSITORY}:${VERSION}" "${IDENTITY}"
          docker buildx imagetools create --tag "${REPOSITORY}:latest" "${IDENTITY}"
          echo "subject_name=${IDENTITY%@*}" >> "${GITHUB_OUTPUT}"
          echo "digest=${IDENTITY#*@}" >> "${GITHUB_OUTPUT}"
      - name: Attest published immutable image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.subject_name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
