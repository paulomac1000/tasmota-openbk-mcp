name: Temporary compliance hardening applicator

on:
  push:
    branches: [agent/ai-skills-compliance-refactor]

permissions:
  contents: write

concurrency:
  group: temporary-compliance-hardening
  cancel-in-progress: false

jobs:
  apply-test-push:
    if: github.ref == 'refs/heads/agent/ai-skills-compliance-refactor'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: agent/ai-skills-compliance-refactor
          fetch-depth: 0
      - name: Check out immutable standards diagnostics
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: paulomac1000/ai-skills
          ref: b54fc6b27ea80b36a70d5de73445970e17f55789
          path: .standards
          persist-credentials: false
      - name: Apply reviewed fixes
        run: python scripts/apply_compliance_fixes.py
      - name: Remove one-shot applicator from final tree
        run: git rm .github/workflows/agent-apply-fixes.yml scripts/apply_compliance_fixes.py
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Install project and dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Format and lint candidate
        run: |
          ruff format .
          ruff check . --fix
          ruff format --check --diff .
          ruff check .
      - name: Type, compile and security checks
        run: |
          mypy local_home_devices_mcp
          python -m compileall -q local_home_devices_mcp tools server.py scripts tests
          bandit -r local_home_devices_mcp tools -ll
      - name: Validate canonical capability manifests
        run: |
          rm -rf /tmp/capability-manifests
          python scripts/export_capability_manifests.py --output /tmp/capability-manifests/default
          python scripts/export_capability_manifests.py --mock --output /tmp/capability-manifests/mock
          python .standards/contracts/validate_capability_manifest.py \
            --schema .standards/contracts/capability-manifest.schema.json \
            /tmp/capability-manifests/default/*.json \
            /tmp/capability-manifests/mock/*.json
      - name: Validate AFDS and AGENTS
        run: |
          python .standards/skills/afds-doc-writer/validate.py README.md docs
          rm -rf /tmp/agents-audit && mkdir -p /tmp/agents-audit
          tar --exclude='./.standards' --exclude='./.git' --exclude='./.venv' \
            -cf - . | tar -xf - -C /tmp/agents-audit
          python .standards/skills/agents-md-architect/tools/audit_agents_md.py \
            --strict --layout single --profile mcp-server --language en /tmp/agents-audit
          python .standards/skills/agents-md-architect/tools/validate_agents_md.py \
            --strict --repository-root /tmp/agents-audit --layout single --profile mcp-server \
            --language en /tmp/agents-audit/AGENTS.md
      - name: Validate final workflow policy
        run: python .standards/skills/ci-cd-architect/tools/check_github_actions_policy.py .
      - name: Run zero-I/O smoke and complete non-real suite
        run: |
          MCP_MOCK_MODE=1 ENABLE_WRITE_OPERATIONS=1 python server.py --mock-self-test
          python -m pytest -m 'not real_system'
      - name: Commit and push only after all checks pass
        run: |
          set -euo pipefail
          git status --short
          git add -A
          git config user.name 'OpenAI compliance agent'
          git config user.email 'openai-agent@users.noreply.github.com'
          git commit -m 'fix: harden 2.0 compliance boundaries'
          git push origin HEAD:agent/ai-skills-compliance-refactor
