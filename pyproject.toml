[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "local-home-devices-mcp"
version = "1.7.0"
description = "Policy-governed MCP server for local home devices"
requires-python = ">=3.13,<3.14"
dependencies = [
  "anyio==4.14.2",
  "defusedxml==0.7.1",
  "fastmcp==3.4.6",
  "paho-mqtt==2.1.0",
  "pydantic==2.12.0",
  "requests==2.32.5",
  "starlette==1.0.1",
  "tinytuya==1.17.4",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
dev = [
  "bandit==1.9.4",
  "build==1.3.0",
  "mcp==1.28.1",
  "mypy==2.3.0",
  "pre-commit==4.6.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.3.0",
  "pytest-cov==7.1.0",
  "ruff==0.15.22",
  "types-defusedxml==0.7.0.20260504",
  "types-requests==2.33.0.20260712",
]

[project.scripts]
local-home-devices-mcp = "server:main"

[tool.setuptools]
py-modules = ["server"]

[tool.setuptools.packages.find]
include = ["local_home_devices_mcp*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "unit: zero-I/O unit tests",
  "integration: mocked or local integration tests",
  "real_system: requires explicitly configured physical devices",
  "smoke: application smoke tests",
  "e2e: end-to-end tests",
  "transport: starts a real MCP transport",
]

[tool.coverage.run]
source = ["local_home_devices_mcp", "tools"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The existing fail-closed translator still uses the tuple spelling in one
# isinstance check. UP038 is cosmetic; keep the security-sensitive translator
# byte-for-byte stable while the compliance work changes its consumers.
"local_home_devices_mcp/manifests.py" = ["UP038"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["local_home_devices_mcp"]

[[tool.mypy.overrides]]
# tinytuya, defusedxml, and paho ship no type stubs; the reviewed legacy
# adapters that consume them stay dynamically typed while the application
# kernel remains strict. tools/iot_tuya delegates to the untyped tinytuya
# SDK (Any-typed Cloud/Device handles and DP maps), so its SDK-boundary
# error codes cannot be strictly typed until tinytuya ships py.typed.
module = [
  "tools.iot_tuya",
  "tools.hikvision.isapi_client",
  "tools.iot_mqtt",
]
ignore_missing_imports = true
disable_error_code = [
  "no-any-return",
  "union-attr",
  "dict-item",
  "var-annotated",
  "assignment",
  "import-untyped",
]
