[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "local-home-devices-mcp"
version = "2.0.0"
description = "Policy-governed MCP server for local home devices"
requires-python = ">=3.12"
dependencies = [
  "defusedxml==0.7.1",
  "fastmcp==3.4.4",
  "paho-mqtt==2.1.0",
  "pydantic==2.12.0",
  "requests==2.32.5",
  "starlette==0.50.0",
  "tinytuya==1.17.4",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
dev = [
  "bandit==1.9.4",
  "build==1.3.0",
  "mypy==2.3.0",
  "pre-commit==4.6.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.3.0",
  "pytest-cov==7.1.0",
  "ruff==0.15.22",
]

[project.scripts]
local-home-devices-mcp = "server:main"

[tool.setuptools]
py-modules = ["server"]

[tool.setuptools.packages.find]
include = ["local_home_devices_mcp*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "unit: zero-I/O unit tests",
  "integration: mocked or local integration tests",
  "real_system: requires explicitly configured physical devices",
  "smoke: application smoke tests",
  "e2e: end-to-end tests",
]

[tool.coverage.run]
source = ["local_home_devices_mcp", "tools"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["local_home_devices_mcp"]
