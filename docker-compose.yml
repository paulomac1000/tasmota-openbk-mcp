services:
  local-home-devices-mcp:
    image: ghcr.io/paulomac1000/local-home-devices-mcp@sha256:REPLACE_WITH_VERIFIED_DIGEST
    env_file: .env
    environment:
      MCP_TRANSPORT: http
      BIND_HOST: 127.0.0.1
      MCP_PORT: 9102
      MCP_PATH: /mcp
      MCP_ARTIFACT_ROOT: /app/data/artifacts
    network_mode: host
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - local-home-devices-mcp-data:/app/data
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  local-home-devices-mcp-data:
